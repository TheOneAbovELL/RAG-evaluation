[project]
name = "rag-evaluation-workbench"
version = "1.4.1"
description = "Run, score, store, compare and export evaluations of a retrieval-augmented question-answering pipeline — offline, or with OpenAI and DeepEval judge metrics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.2.6",          # LLM-as-a-judge metrics (optional at runtime: only with an API key)
    "langchain>=1.4.2",         # tool-calling agent pipeline
    "langchain-openai>=1.6.6",  # OpenAI chat model and embeddings
    "pandas>=3.0.6",            # tabular views and CSV export
    "pydantic>=2.13",           # data contracts and settings validation
    # PDF text extraction. <2: PyMuPDF 2.0 adds onnxruntime + layout models loaded at import (~3 s measured)
    # that plain block extraction does not need.
    "pymupdf>=1.28.2,<2",
    "python-dotenv>=1.0",       # optional .env loading
    "streamlit>=1.64.0",        # user interface
]

[project.optional-dependencies]
semantic = [
    "fastembed>=0.4",  # local embedding model (ONNX): semantic metrics and offline embedding/hybrid retrieval
]

[project.scripts]
ragwb = "rag_workbench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",         # lint + import order
    "mypy>=1.13",        # static types
    "pip-audit>=2.7",    # dependency vulnerability audit (queries public advisory databases)
]
docs = [
    "markdown>=3.7",  # project-book Markdown -> HTML (PDF via headless Chrome/Edge)
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_workbench"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "rag_workbench/_examples"  # so a wheel works out of the box

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:deepeval"  # DeepEval's own pytest plugin would load a real .env at start-up, before conftest can stop it
markers = [
    "ui: Streamlit AppTest user-journey tests",
    "live: paid OpenAI/DeepEval calls; skipped unless RAGWB_LIVE_TESTS=1 and OPENAI_API_KEY are set",
]

[tool.coverage.run]
source = ["rag_workbench"]
omit = ["*/ui/views/*"]  # page scripts are exercised by AppTest in-process, which coverage cannot attribute reliably

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["docs/project-book/generated"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade, B bugbear, C4 comprehensions, SIM simplify, RUF ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PLW"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # the docs and UI use typographic characters on purpose (→, ·, –)
    "SIM108",                       # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B011", "SIM117"]
"scripts/*" = ["E501"]
"docs/project-book/tools/*" = ["E501"]
"docs/user-guide/tools/*" = ["E501"]
"src/rag_workbench/ui/views/*" = ["E402"]  # page scripts import after st.* setup by design

[tool.ruff.lint.isort]
known-first-party = ["rag_workbench"]

[tool.mypy]
python_version = "3.12"
files = ["src", "start.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
