<svg xmlns='http://www.w3.org/2000/svg' width='1040' height='620' viewBox='0 0 1040 620' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13'>
<title>sequence of an offline run started from the UI</title>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#495057'/></marker></defs>
<rect width='1040' height='620' fill='white'/>
<text x='20' y='28' font-size='15' text-anchor='start' font-weight='600' fill='#212529'>Figure: sequence of an offline run started from the UI</text>
<rect x='28' y='45' width='124' height='36' rx='8' fill='#dbe4ff' stroke='#495057' stroke-width='1.2'/>
<text x='90.0' y='67.0' text-anchor='middle' font-weight='600'>New evaluation page</text>
<line x1='90' y1='81' x2='90' y2='605' stroke='#adb5bd' stroke-dasharray='4,4'/>
<rect x='178' y='45' width='124' height='36' rx='8' fill='#e6fcf5' stroke='#495057' stroke-width='1.2'/>
<text x='240.0' y='67.0' text-anchor='middle' font-weight='600'>EvaluationRunner</text>
<line x1='240' y1='81' x2='240' y2='605' stroke='#adb5bd' stroke-dasharray='4,4'/>
<rect x='328' y='45' width='124' height='36' rx='8' fill='#e6fcf5' stroke='#495057' stroke-width='1.2'/>
<text x='390.0' y='67.0' text-anchor='middle' font-weight='600'>RAGPipeline</text>
<line x1='390' y1='81' x2='390' y2='605' stroke='#adb5bd' stroke-dasharray='4,4'/>
<rect x='478' y='45' width='124' height='36' rx='8' fill='#e6fcf5' stroke='#495057' stroke-width='1.2'/>
<text x='540.0' y='67.0' text-anchor='middle' font-weight='600'>BM25Retriever</text>
<line x1='540' y1='81' x2='540' y2='605' stroke='#adb5bd' stroke-dasharray='4,4'/>
<rect x='628' y='45' width='124' height='36' rx='8' fill='#e6fcf5' stroke='#495057' stroke-width='1.2'/>
<text x='690.0' y='67.0' text-anchor='middle' font-weight='600'>Metric</text>
<line x1='690' y1='81' x2='690' y2='605' stroke='#adb5bd' stroke-dasharray='4,4'/>
<rect x='778' y='45' width='124' height='36' rx='8' fill='#e6fcf5' stroke='#495057' stroke-width='1.2'/>
<text x='840.0' y='67.0' text-anchor='middle' font-weight='600'>RunStore</text>
<line x1='840' y1='81' x2='840' y2='605' stroke='#adb5bd' stroke-dasharray='4,4'/>
<line x1='90' y1='110' x2='240' y2='110' stroke='#495057' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='165.0' y='105' font-size='11' text-anchor='middle' font-weight='400' fill='#212529'>prepare(config)</text>
<path d='M240,144 h40 v14 h-36' fill='none' stroke='#495057' marker-end='url(#arrow)'/>
<text x='286' y='154' font-size='11' text-anchor='start' font-weight='400' fill='#212529'>load dataset, chunks; build pipeline, metrics</text>
<line x1='90' y1='178' x2='240' y2='178' stroke='#495057' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='165.0' y='173' font-size='11' text-anchor='middle' font-weight='400' fill='#212529'>execute(prepared, progress)</text>
<line x1='240' y1='212' x2='840' y2='212' stroke='#495057' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='540.0' y='207' font-size='11' text-anchor='middle' font-weight='400' fill='#212529'>create_run(status=running)</text>
<line x1='240' y1='246' x2='390' y2='246' stroke='#495057' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='315.0' y='241' font-size='11' text-anchor='middle' font-weight='400' fill='#212529'>answer(question)   [per case]</text>
<line x1='390' y1='280' x2='540' y2='280' stroke='#495057' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='465.0' y='275' font-size='11' text-anchor='middle' font-weight='400' fill='#212529'>retrieve(question, k)</text>
<line x1='540' y1='314' x2='390' y2='314' stroke='#495057' stroke-width='1.3' stroke-dasharray='5,4' marker-end='url(#arrow)'/>
<text x='465.0' y='309' font-size='11' text-anchor='middle' font-weight='400' fill='#212529'>RetrievedChunk[k]</text>
<path d='M390,348 h40 v14 h-36' fill='none' stroke='#495057' marker-end='url(#arrow)'/>
<text x='436' y='358' font-size='11' text-anchor='start' font-weight='400' fill='#212529'>generator.generate(question, passages)</text>
<line x1='390' y1='382' x2='240' y2='382' stroke='#495057' stroke-width='1.3' stroke-dasharray='5,4' marker-end='url(#arrow)'/>
<text x='315.0' y='377' font-size='11' text-anchor='middle' font-weight='400' fill='#212529'>Generation</text>
<line x1='240' y1='416' x2='690' y2='416' stroke='#495057' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='465.0' y='411' font-size='11' text-anchor='middle' font-weight='400' fill='#212529'>evaluate(MetricInput, threshold)</text>
<line x1='690' y1='450' x2='240' y2='450' stroke='#495057' stroke-width='1.3' stroke-dasharray='5,4' marker-end='url(#arrow)'/>
<text x='465.0' y='445' font-size='11' text-anchor='middle' font-weight='400' fill='#212529'>MetricResult</text>
<line x1='240' y1='484' x2='840' y2='484' stroke='#495057' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='540.0' y='479' font-size='11' text-anchor='middle' font-weight='400' fill='#212529'>add_case_result(case)</text>
<line x1='240' y1='518' x2='90' y2='518' stroke='#495057' stroke-width='1.3' stroke-dasharray='5,4' marker-end='url(#arrow)'/>
<text x='165.0' y='513' font-size='11' text-anchor='middle' font-weight='400' fill='#212529'>progress(done, total)</text>
<line x1='240' y1='552' x2='840' y2='552' stroke='#495057' stroke-width='1.3' marker-end='url(#arrow)'/>
<text x='540.0' y='547' font-size='11' text-anchor='middle' font-weight='400' fill='#212529'>finish_run(status, summary)</text>
<line x1='240' y1='586' x2='90' y2='586' stroke='#495057' stroke-width='1.3' stroke-dasharray='5,4' marker-end='url(#arrow)'/>
<text x='165.0' y='581' font-size='11' text-anchor='middle' font-weight='400' fill='#212529'>RunRecord</text>
</svg>